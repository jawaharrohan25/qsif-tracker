name: Update NAV

on:
  schedule:
    - cron: "30 17 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_nav.py
      - run: |
          git config user.name "nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git add nav.json
          git diff --cached --quiet || (git commit -m "Update NAV" && git push)
